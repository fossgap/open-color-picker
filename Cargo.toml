[package]
name = "open-color-picker"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "A native GTK3 color picker for X11 and Wayland"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/fossgap/open-color-picker"
publish = false

[dependencies]
futures-channel = "0.3"
gstreamer = "0.21"
gstreamer-app = "0.21"
gstreamer-video = "0.21"
gtk = "0.18.2"
ksni = { version = "0.3", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

